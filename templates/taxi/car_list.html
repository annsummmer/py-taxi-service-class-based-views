{% extends "base.html" %}
{% block content %}
  <h1>Cars list:</h1>
  {% if cars_list %}
    <ul>
    {% for car in cars_list %}
      <li><a href="{{ car.get_absolute_url }}">{{ car.pk }} {{ car.model }}</a></li>
    {% endfor %}
    </ul>
  {% else %}
    <p>There are no Cars</p>
  {% endif %}
{% endblock %}
