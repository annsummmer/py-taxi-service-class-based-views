{% extends "base.html" %}
{% block content %}
  <h1>Drivers list:</h1>
  {% if drivers_list %}
    <ul>
    {% for driver in drivers_list %}
      <li><a href="{{ driver.get_absolute_url }}">{{ driver.first_name }} {{ driver.last_name }}</a></li>
    {% endfor %}
    </ul>
  {% else %}
    <p>There are no Driver found</p>
  {% endif %}
{% endblock %}
